<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microscope Capture</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="top-bar" role="banner">
      <span id="app-title">Microscope Capture</span>
      <div id="camera-select-row">
        <label for="camera-select">Camera</label>
        <select id="camera-select"></select>
      </div>
      <button id="info-btn" aria-label="Camera settings" aria-expanded="false">ⓘ</button>
    </header>

    <div id="error-message" class="hidden" role="alert" aria-live="assertive"></div>

    <video id="preview" autoplay playsinline muted></video>
    <img id="capture-preview" class="hidden" alt="Captured image" />
    <canvas id="capture-canvas" class="hidden"></canvas>

    <footer id="bottom-bar" role="contentinfo">
      <button id="retake-btn" class="hidden">Retake</button>
      <input type="text" id="filename-input" aria-label="Filename" placeholder="filename" />
      <span class="ext-label">.png</span>
      <button id="capture-btn">Capture</button>
    </footer>

    <section id="info-panel" class="hidden" aria-labelledby="info-panel-heading">
      <h2 id="info-panel-heading">Camera Settings</h2>
      <dl id="settings-grid"></dl>
    </section>
  </div>

  <script src="vendor/exifr.js"></script>
  <script src="app.js"></script>
</body>
</html>
